<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Arte Virtual</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ffffff 0%, #d0d0d0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            gap: 30px;
        }

        .gallery-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
        }

        .image-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            min-height: 400px;
        }

        img {
            max-width: 600px;
            max-height: 400px;
            width: auto;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        img:hover {
            transform: scale(1.02);
        }

        button {
            /* From https://css.glass */
            background: rgba(77, 66, 66, 0.15);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(6.6px);
            -webkit-backdrop-filter: blur(6.6px);
            border: 1px solid rgba(77, 66, 66, 0.33);
            /* From https://css.glass */
            background: rgba(77, 66, 66, 0.15);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(6.6px);
            -webkit-backdrop-filter: blur(6.6px);
            border: 1px solid rgba(77, 66, 66, 0.33);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: scale(0.95);
        }

        .info-container {
            text-align: center;
            padding: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .info-container h2 {
            font-size: 28px;
            color: #000000;
            margin-bottom: 10px;
        }

        .info-container h3 {
            font-size: 20px;
            color: #666;
            font-style: italic;
            margin-bottom: 20px;
        }

        .info-container p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            text-align: justify;
        }

        footer {
            background: rgba(0, 0, 0, 0.2);
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        footer a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: #667eea;
        }

        @media (max-width: 768px) {
            .gallery-container {
                padding: 20px;
            }

            img {
                width: 100%;
                height: 250px;
            }

            button {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
        }

        #Andrey-Seg{
            text-decoration: underline;
            font-style: oblique;
            font-size: bolder;
        }
    </style>
</head>
<body>
    <main>
        <div class="gallery-container">
            <div class="image-container">
                <button id="prevBtn">‹</button>
                <img id="artwork" src="IMGs/aColheita.jpeg" alt="Pintura">
                <button id="nextBtn">›</button>
            </div>
            <div class="info-container">
                <h2 id="artworkTitle">A Colheita</h2>
                <h3 id="artistName">Artista</h3>
                <p id="description">Lorem ipsum dolor sit amet consectetur adipisicing elit. Molestias obcaecati similique eum numquam, quaerat voluptas cupiditate doloremque ut repellat, laborum sit nisi distinctio ea, deserunt exercitationem facilis itaque esse maxime.</p>
            </div>
        </div>
    </main>

    <footer>
        Site desenvolvido por <a href="https://github.com/andrey-seg" target="_blank" id="Andrey-Seg">Andrey Segobia</a>
    </footer>

    <script>
        
        const paint = document.getElementById('artwork');
        const title = document.getElementById('artworkTitle');
        const artist = document.getElementById('artistName');
        const description = document.getElementById('description');

        const artworksArray = [{
            src: "IMGs/aColheita.jpeg",
            title: "A Colheita",
            artist: "Pieter Bruegel the Elder",
            description: "A Colheita é uma pintura de Pieter Bruegel"
        },
        {
            src:"IMGs/caminhoSobreAsIrises.jpeg",
            title: "Caminho sobre as irises",
            artist: "Claude Monet",
            description: "O caminho sobre as ireses e uma pintura de Claude monet"
        },
        {
            src:"IMGs/HaystacksAutumn.jpeg",
            title: "Haystacks Autumn",
            artist: "Jean-François Millet",
            description: "Haystacks Autumn e uma pintura de Jean-François Millet"
        },
        {
            src: "IMGs/JoanaARC.jpeg",
            title: "Joana ARC",
            artist: "Jules Bastien-Lepage",
            description: "Joana ARC e uma pinturea de Jules Bastien-Lepage"
        },
        {
            src:"IMGs/ponteSobreLago.jpeg",
            title: "Ponte sobre o lago",
            artist: "Claude Monet",
            description: "Ponte sobre o lago e uma pintura de Claude Monet"
        }];

        let currentPaint = 0;

        function ChangePaintNext(){
            currentPaint++;

            if (currentPaint>=artworksArray.length){
                currentPaint = 0;
            }

            paint.src = artworksArray[currentPaint].src;
            title.textContent = artworksArray[currentPaint].title;
            artist.textContent = artworksArray[currentPaint].artist;
            description.textContent = artworksArray[currentPaint].description;
        }

        const nextButton = document.getElementById("nextBtn");
        nextButton.addEventListener("click", ChangePaintNext)

        function ChangePaintPrev(){
            currentPaint--;

            if(currentPaint < 0){
                currentPaint = artworksArray.length-1
            }

            paint.src = artworksArray[currentPaint].src;
            title.textContent = artworksArray[currentPaint].title;
            artist.textContent = artworksArray[currentPaint].artist;
            description.textContent = artworksArray[currentPaint].description;
        }

        const prevBtn = document.getElementById("prevBtn");
        prevBtn.addEventListener("click", ChangePaintPrev)
    </script>
</body>
</html>
